name: APF3 - Sondeo HTTP de rendimiento

on:
  push:
    branches: [apf3-ci]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondeo-http:
    name: Medicion ligera sin modificar datos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Medir latencia y respuestas HTTP
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, os, statistics, time
          from concurrent.futures import ThreadPoolExecutor
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          
          BASE = "https://delicias-peruanas-api.onrender.com"
          os.makedirs("evidencias-apf3", exist_ok=True)
          rows = []
          
          def medir(path, modalidad, intento):
              url = BASE + path
              inicio = time.perf_counter()
              codigo = "SIN_RESPUESTA"
              error = ""
              try:
                  req = Request(url, headers={"User-Agent": "APF3-Sondeo-Academico/1.0"})
                  with urlopen(req, timeout=60) as respuesta:
                      codigo = str(respuesta.status)
                      respuesta.read(256)
              except HTTPError as exc:
                  codigo = str(exc.code)
                  exc.close()
              except (URLError, TimeoutError, OSError) as exc:
                  error = str(exc)[:180]
              return {
                  "ruta": path,
                  "modalidad": modalidad,
                  "intento": intento,
                  "codigo_http": codigo,
                  "tiempo_ms": round((time.perf_counter() - inicio) * 1000, 1),
                  "error": error
              }
          
          for ruta in ["/", "/api/categorias"]:
              for intento in range(1, 6):
                  rows.append(medir(ruta, "secuencial", intento))
                  time.sleep(0.5)
          
          with ThreadPoolExecutor(max_workers=2) as pool:
              rows.extend(list(pool.map(lambda i: medir("/api/categorias", "concurrencia_2", i), range(1, 7))))
          
          campos = ["ruta", "modalidad", "intento", "codigo_http", "tiempo_ms", "error"]
          with open("evidencias-apf3/sondeo_http.csv", "w", newline="", encoding="utf-8") as archivo:
              escritor = csv.DictWriter(archivo, fieldnames=campos)
              escritor.writeheader()
              escritor.writerows(rows)
          
          resumen = []
          for ruta, modalidad in [("/", "secuencial"), ("/api/categorias", "secuencial"), ("/api/categorias", "concurrencia_2")]:
              grupo = [r for r in rows if r["ruta"] == ruta and r["modalidad"] == modalidad]
              respuestas = [r for r in grupo if r["codigo_http"] != "SIN_RESPUESTA"]
              tiempos = sorted(r["tiempo_ms"] for r in respuestas)
              estados = {}
              for r in grupo:
                  estados[r["codigo_http"]] = estados.get(r["codigo_http"], 0) + 1
              resumen.append({
                  "ruta": ruta, "modalidad": modalidad, "solicitudes": len(grupo),
                  "respuestas_http": len(respuestas), "estados": estados,
                  "promedio_ms": round(statistics.mean(tiempos), 1) if tiempos else None,
                  "minimo_ms": min(tiempos) if tiempos else None,
                  "p95_ms": tiempos[max(0, (95 * len(tiempos) + 99) // 100 - 1)] if tiempos else None,
                  "maximo_ms": max(tiempos) if tiempos else None
              })
          
          with open("evidencias-apf3/resumen.json", "w", encoding="utf-8") as archivo:
              json.dump({"tipo": "sondeo HTTP ligero, no prueba de estres", "resultados": resumen}, archivo, indent=2, ensure_ascii=False)
          
          lineas = [
              "## APF3: sondeo HTTP ligero de la API",
              "",
              "Solo solicitudes GET sin autenticacion. No mide uso de CPU/RAM ni rendimiento de operaciones autenticadas.",
              "Un codigo 401/403/404 significa que el servidor respondio, no que la operacion funcional tuvo exito.",
              "Los valores incluyen latencia de red y posibles arranques en frio de Render.",
              "",
              "| Ruta | Modalidad | Intentos | Respuestas HTTP | Codigos | Promedio (ms) | p95 (ms) |",
              "|---|---|---:|---:|---|---:|---:|"
          ]
          for r in resumen:
              lineas.append(f"| {r['ruta']} | {r['modalidad']} | {r['solicitudes']} | {r['respuestas_http']} | {r['estados']} | {r['promedio_ms']} | {r['p95_ms']} |")
          texto = "\n".join(lineas) + "\n"
          print(texto)
          with open("evidencias-apf3/resumen.md", "w", encoding="utf-8") as archivo:
              archivo.write(texto)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as archivo:
              archivo.write(texto)
          PY
      - name: Guardar resultados para APF3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apf3-sondeo-http
          path: evidencias-apf3/
          if-no-files-found: warn
