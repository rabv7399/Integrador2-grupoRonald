name: CI Backend Java 21

on:
  push:
    branches: [main, develop, apf3-ci]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      DB_URL: "jdbc:h2:mem:ci;MODE=MySQL;DB_CLOSE_DELAY=-1"
      DB_USER: sa
      DB_PASSWORD: ""
      DDL_AUTO: create-drop
      JWT_SECRET: "ci-only-test-secret-for-jwt-signing-1234567890"
      JWT_EXPIRATION_MS: "3600000"

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar y ejecutar pruebas Maven
        run: bash ./mvnw -B -ntp clean verify
