name: Semana 14 - pruebas del modulo de incidentes
on:
  push:
    branches:
      - feature/semana14-incidentes
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/semana14-incidentes-ci.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Ejecutar pruebas unitarias
        working-directory: backend
        run: mvn -B -ntp test
