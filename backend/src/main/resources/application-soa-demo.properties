# APF3 SOA - DEMOSTRACION LOCAL. Nunca activar este perfil en Render.
spring.datasource.url=jdbc:h2:mem:delicias_soa_apf3;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=8081
jwt.secret=${SOA_DEMO_JWT_SECRET}
jwt.expiration-ms=3600000

# Credenciales de usuarios demo se reciben desde la terminal
soa.demo.admin-password=${SOA_DEMO_ADMIN_PASSWORD}
soa.demo.client-password=${SOA_DEMO_CLIENT_PASSWORD}
soa.demo.mozo-password=${SOA_DEMO_MOZO_PASSWORD}
soa.demo.supervisor-password=${SOA_DEMO_SUPERVISOR_PASSWORD}
soa.demo.caja-password=${SOA_DEMO_CAJA_PASSWORD}
soa.demo.cocinero-password=${SOA_DEMO_COCINERO_PASSWORD}
