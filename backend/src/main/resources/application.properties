spring.application.name=backend

# ===============================
# CONEXION A BASE DE DATOS
# ZERO HARDCODING
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexiones HikariCP para Aiven MySQL Free.
# Valores iniciales conservadores, ajustables sin guardar secretos en el repositorio.
# Validar conexiones y latencia antes de cambiar estos limites en produccion.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVIDOR
# ===============================
server.port=${PORT:8080}
# ===============================
# JWT - ZERO HARDCODING
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===============================
# CORS - ORIGENES RESTRINGIDOS
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
